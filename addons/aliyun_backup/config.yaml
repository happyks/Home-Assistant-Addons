# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: 阿里云盘自动备份/Aliyun Drive Backup
version: "1.0.17"
slug: aliyun_backup_custom
description: AliyunDrive Backup
url: "https://sumju.net"
arch:
  - aarch64
  - amd64
init: false
hassio_api: true
hassio_role: backup
ingress: true
panel_icon: "mdi:cloud"
panel_title: "CN-Backups"
map:
  - backup:rw
  - ssl
options:
  keep_days_local: 7
  keep_days_cloud: 7
  backup_time: 03:00:00
  folder_name: "IT Commander HA Backup"
  backup_monday: false
  backup_tuesday: false
  backup_wednesday: false
  backup_thursday: false
  backup_friday: false
  backup_saturday: true
  backup_sunday: false
schema:
  keep_days_local: "int(1,30)"
  keep_days_cloud: "int(3,30)"
  backup_time: str
  folder_name: str
  backup_monday: bool
  backup_tuesday: bool
  backup_wednesday: bool
  backup_thursday: bool
  backup_friday: bool
  backup_saturday: bool
  backup_sunday: bool
image: "ghcr.io/happyks/{arch}-addon-aliyun-backup"
