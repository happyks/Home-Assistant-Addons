name: "Sync aarch64 to Aliyun"

on:
  workflow_dispatch:

jobs:
  sync:
    name: Sync aarch64 image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version:' addons/aliyun_backup/config.yaml | awk '{print $2}' | tr -d '"')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Sync aarch64
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SOURCE="ghcr.io/happyks/aarch64-addon-aliyun-backup:${VERSION}"
          TARGET="${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAME_SPACE }}/aarch64-addon-aliyun-backup:${VERSION}"
          TARGET_LATEST="${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAME_SPACE }}/aarch64-addon-aliyun-backup:latest"

          echo "Syncing $SOURCE -> $TARGET"
          docker buildx imagetools create --tag $TARGET $SOURCE
          docker buildx imagetools create --tag $TARGET_LATEST $SOURCE
          echo "aarch64 done"
