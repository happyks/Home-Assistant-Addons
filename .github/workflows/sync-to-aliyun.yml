name: "Sync to Aliyun ACR"

on:
  workflow_dispatch:

jobs:
  sync:
    name: Sync Docker Image to Aliyun
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get version from config.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' addons/aliyun_backup/config.yaml | awk '{print $2}' | tr -d '"')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Pull from GHCR and push to Aliyun
        run: |
          SOURCE_IMAGE="ghcr.io/happyks/addon-aliyun-backup:${{ steps.version.outputs.version }}"
          TARGET_IMAGE="${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAME_SPACE }}/addon-aliyun-backup:${{ steps.version.outputs.version }}"

          docker pull $SOURCE_IMAGE
          docker tag $SOURCE_IMAGE $TARGET_IMAGE
          docker push $TARGET_IMAGE

          docker tag $SOURCE_IMAGE "${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAME_SPACE }}/addon-aliyun-backup:latest"
          docker push "${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAME_SPACE }}/addon-aliyun-backup:latest"
